<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPPA Todo 플래너</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- SortableJS 라이브러리 추가 -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f9fafb;
        }
        /* 커스텀 스크롤바 */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        ::-webkit-scrollbar-thumb {
            background: #d1d5db;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #9ca3af;
        }
        .task-card-enter {
            animation: card-enter 0.4s ease-out;
        }
        @keyframes card-enter {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        /* 모달 배경 */
        .modal-overlay {
            transition: opacity 0.3s ease;
        }
        .user-name-header {
            cursor: pointer;
        }
        /* 드래그 중인 카드 스타일 */
        .sortable-ghost {
            opacity: 0.4;
            background-color: #c7d2fe;
        }
        .sortable-drag {
            cursor: grabbing;
        }
        .drag-handle {
            cursor: grab;
        }
    </style>
</head>
<body class="text-gray-800">

    <div id="app-container" class="container mx-auto px-4 py-8 hidden">

        <!-- 헤더: 타이틀 및 날짜 선택 -->

    <!-- Firebase SDK 추가 -->
    <script type="module">

        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

            authDomain: "ippa-todo.firebaseapp.com",
            projectId: "ippa-todo",
            storageBucket: "ippa-todo.appspot.com",
            messagingSenderId: "160562508293",
            appId: "1:160562508293:web:5c7a03d0a7881b3323a26c",
            measurementId: "G-FVC3VK9TB7"
        };

                window.dispatchEvent(new CustomEvent('firebase-ready'));
            } else {
                window.location.href = './index.html';
            }
        });

        window.db = db;
        window.auth = auth; // 로그아웃을 위해 auth 객체도 전역으로 전달
        window.firestoreFunctions = { doc, setDoc, getDoc, onSnapshot, collection, query, where, getDocs, deleteDoc, writeBatch, updateDoc, orderBy, signOut };

    <script>
    window.addEventListener('firebase-ready', () => {
        const { doc, setDoc, onSnapshot, collection, query, deleteDoc, writeBatch, updateDoc, getDocs, where, orderBy, signOut } = window.firestoreFunctions;
        const db = window.db;
        const auth = window.auth;
        const currentUser = window.currentUser;

        // DOM Elements
        const datePicker = document.getElementById('date-picker');
        const dayOfWeekEl = document.getElementById('day-of-week');
        const prevDayBtn = document.getElementById('prev-day-btn');
        const nextDayBtn = document.getElementById('next-day-btn');
        const userLanesContainer = document.getElementById('user-lanes');
        
        const modal = document.getElementById('add-todo-modal');
        const modalTitle = document.getElementById('modal-title');
        const modalForm = document.getElementById('modal-form');
        const modalInput = document.getElementById('modal-input');
        const modalCloseBtn = document.getElementById('modal-close-btn');

        const confirmModal = document.getElementById('confirm-modal');
        const confirmTitle = document.getElementById('confirm-title');
        const confirmMessage = document.getElementById('confirm-message');
        const confirmYesBtn = document.getElementById('confirm-yes-btn');
        const confirmNoBtn = document.getElementById('confirm-no-btn');
        
        const manageUserModal = document.getElementById('manage-user-modal');
        const inactiveUserList = document.getElementById('inactive-user-list');
        const addUserForm = document.getElementById('add-user-form');
        const newUserNameInput = document.getElementById('new-user-name-input');
        const manageUserCloseBtn = document.getElementById('manage-user-close-btn');
        
        const recurringModal = document.getElementById('recurring-modal');
        const dayCheckboxesContainer = document.getElementById('day-checkboxes');
        const unpinBtn = document.getElementById('unpin-btn');
        const saveRecurringBtn = document.getElementById('save-recurring-btn');
        const recurringStartInput = document.getElementById('recurring-start');
        const recurringEndInput = document.getElementById('recurring-end');

        const unpinModal = document.getElementById('unpin-modal');
        const unpinCurrentBtn = document.getElementById('unpin-current-btn');
        const unpinFutureBtn = document.getElementById('unpin-future-btn');
        const unpinCancelBtn = document.getElementById('unpin-cancel-btn');

        const profileButton = document.getElementById('profile-button');
        const profileDropdown = document.getElementById('profile-dropdown');
        const profileImage = document.getElementById('profile-image');
        const profileName = document.getElementById('profile-name');
        const profileEmail = document.getElementById('profile-email');
        const manageUserBtn = document.getElementById('manage-user-btn');
        const logoutBtn = document.getElementById('logout-btn');
        const todayBtn = document.getElementById('today-btn');

        const pastelColors = ['bg-red-200', 'bg-orange-200', 'bg-yellow-200', 'bg-green-200', 'bg-emerald-200', 'bg-teal-200', 'bg-cyan-200', 'bg-sky-200', 'bg-blue-200', 'bg-indigo-200', 'bg-violet-200', 'bg-purple-200', 'bg-fuchsia-200', 'bg-pink-200', 'bg-rose-200'];
        const daysOfWeek = [{label: '일', value: 0}, {label: '월', value: 1}, {label: '화', value: 2}, {label: '수', value: 3}, {label: '목', value: 4}, {label: '금', value: 5}, {label: '토', value: 6}];
        
        let activeUsers = [];
        let inactiveUsers = [];
        let allTodos = [];
        let modalContext = {};
        let confirmCallback = () => {};
        let recurringTodoContext = null;
        let sortableInstance = null;

        // --- 유틸리티 함수 ---
        function getFormattedDate(date) {
            const year = date.getFullYear();
            const month = (date.getMonth() + 1).toString().padStart(2, '0');
            const day = date.getDate().toString().padStart(2, '0');
            return `${year}-${month}-${day}`;
        }
        function getDayOfWeek(dateString) {
            const date = new Date(dateString + 'T00:00:00');
            return daysOfWeek[date.getDay()].label;
        }

        // --- 렌더링 함수 ---
        function render() {
            const selectedDate = datePicker.value;
            dayOfWeekEl.textContent = `(${getDayOfWeek(selectedDate)})`;
            userLanesContainer.innerHTML = '';
            const displayTodos = getTodosForDate(selectedDate);
            activeUsers.forEach(user => userLanesContainer.appendChild(createUserLane(user, selectedDate, displayTodos)));
            
            initializeSortable();
        }
        
        function createUserLane(user, selectedDate, displayTodos) {
            const lane = document.createElement('div');
            lane.className = 'relative flex-shrink-0 w-80 bg-gray-100 rounded-xl p-4';
            lane.dataset.userId = user.id;
            
            const dragHandle = document.createElement('div');
            dragHandle.className = 'drag-handle absolute top-2 left-2 text-green-700';
            dragHandle.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" /></svg>`;
            lane.appendChild(dragHandle);

            const userHeaderContainer = document.createElement('div');
            userHeaderContainer.className = 'relative flex items-center justify-center mb-4 group';
            const userHeader = document.createElement('h2');
            userHeader.className = 'text-xl font-bold text-gray-700 user-name-header hover:bg-gray-200 px-2 py-1 rounded-md transition';
            userHeader.textContent = user.name;
            userHeader.onclick = () => editUserName(user, userHeader);
            const userControls = document.createElement('div');
            userControls.className = 'absolute right-0 flex items-center opacity-0 group-hover:opacity-100 transition-opacity';
            const resetButton = document.createElement('button');
            resetButton.className = 'text-gray-400 hover:text-blue-500 transition-colors p-1';
            resetButton.title = `${user.name}의 할 일 초기화`;
            resetButton.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M20 11a8.1 8.1 0 0 0 -15.5 -2m-.5 -4v4h4" /><path d="M4 13a8.1 8.1 0 0 0 15.5 2m.5 4v-4h-4" /></svg>`;
            resetButton.onclick = () => showConfirmation('목록 초기화', `'${user.name}'의 고정되지 않은 할 일을 모두 삭제하시겠습니까?`, () => resetUserTasks(user.name, selectedDate));
            const deactivateUserButton = document.createElement('button');
            deactivateUserButton.className = 'text-gray-400 hover:text-red-500 transition-colors p-1';
            deactivateUserButton.title = `${user.name} 사용자 비활성화`;
            deactivateUserButton.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd" /></svg>`;
            deactivateUserButton.onclick = () => showConfirmation('사용자 비활성화', `'${user.name}' 사용자를 목록에서 숨깁니다. 데이터는 보존되며 나중에 복원할 수 있습니다. 계속하시겠습니까?`, () => deactivateUser(user));
            userHeaderContainer.appendChild(userHeader);
            userControls.appendChild(resetButton);
            userControls.appendChild(deactivateUserButton);
            userHeaderContainer.appendChild(userControls);
            lane.appendChild(userHeaderContainer);
            lane.appendChild(createPeriodSection('오전', 'am', user.name, selectedDate, displayTodos[user.name]?.am || []));
            lane.appendChild(createPeriodSection('오후', 'pm', user.name, selectedDate, displayTodos[user.name]?.pm || []));
            return lane;
        }
        
        function getTodosForDate(selectedDate) {
            const dailyTasks = {};
            activeUsers.forEach(user => dailyTasks[user.name] = { am: [], pm: [] });
            const selectedDayOfWeek = new Date(selectedDate + 'T00:00:00').getDay();

            allTodos.forEach(todo => {
                const startOk = !todo.startDate || selectedDate >= todo.startDate;
                const endOk = !todo.endDate || selectedDate <= todo.endDate;
                const notSkipped = !todo.skipDates || !todo.skipDates.includes(selectedDate);
                const isRecurringToday = todo.recurringDays && todo.recurringDays.length > 0 && todo.recurringDays.includes(selectedDayOfWeek) && startOk && endOk && notSkipped;
                const isOneTimeTaskToday = (!todo.recurringDays || todo.recurringDays.length === 0) && todo.date === selectedDate;

                if (isRecurringToday || isOneTimeTaskToday) {
                    const displayTodo = { ...todo };
                    displayTodo.completed = todo.completions?.[selectedDate] || false;
                    if(dailyTasks[displayTodo.user]) {
                        dailyTasks[displayTodo.user][displayTodo.period].push(displayTodo);
                    }
                }
            });
            return dailyTasks;
        }

        function createPeriodSection(title, period, user, date, taskItems) {
            const section = document.createElement('div');
            section.className = 'mb-4';
            const header = document.createElement('div');
            header.className = 'flex justify-between items-center mb-2';
            const sectionTitle = document.createElement('h3');
            sectionTitle.className = 'font-semibold text-gray-600';
            sectionTitle.textContent = title;
            const addButton = document.createElement('button');
            addButton.className = 'w-7 h-7 bg-white rounded-full flex items-center justify-center text-gray-500 hover:bg-indigo-100 hover:text-indigo-600 transition shadow';
            addButton.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" /></svg>`;
            addButton.onclick = () => openModal(user, period, date);
            header.appendChild(sectionTitle);
            header.appendChild(addButton);
            section.appendChild(header);
            const taskList = document.createElement('div');
            taskList.className = 'space-y-3';
            if (taskItems.length > 0) {
                taskItems.forEach(todo => taskList.appendChild(createTodoCard(todo)));
            } else {
                const emptyMsg = document.createElement('p');
                emptyMsg.className = 'text-sm text-gray-400 px-2 py-4 text-center';
                emptyMsg.textContent = '할 일이 없습니다.';
                taskList.appendChild(emptyMsg);
            }
            section.appendChild(taskList);
            return section;
        }

        function createTodoCard(todo) {
            const card = document.createElement('div');
            const colorIndex = (parseInt(todo.id.slice(-5), 16)) % pastelColors.length;
            card.className = `p-3 rounded-lg shadow flex items-start gap-3 transition-all duration-300 task-card-enter ${pastelColors[colorIndex]} ${todo.completed ? 'opacity-60' : ''}`;
            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.checked = todo.completed;
            checkbox.className = 'mt-1 h-5 w-5 rounded border-gray-400 text-indigo-600 focus:ring-indigo-500 cursor-pointer';
            checkbox.onchange = async () => {
                const selectedDate = datePicker.value;
                const completionPath = `completions.${selectedDate}`;
                await updateDoc(doc(db, "todos", todo.id), { [completionPath]: !todo.completed });
            };
            const textWrapper = document.createElement('div');
            textWrapper.className = 'flex-1';
            const textElement = document.createElement('p');
            textElement.textContent = todo.text;
            textElement.className = `font-medium text-gray-800 break-words ${todo.completed ? 'line-through text-gray-600' : ''}`;
            textWrapper.appendChild(textElement);
            const controlsWrapper = document.createElement('div');
            controlsWrapper.className = 'flex items-center gap-2';
            const pinButton = document.createElement('button');
            pinButton.className = 'text-gray-500 hover:text-indigo-600 transition-colors';
            pinButton.innerHTML = (todo.recurringDays && todo.recurringDays.length > 0)
                ? `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-indigo-600" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 2a2 2 0 00-2 2v2H7a2 2 0 00-2 2v8a2 2 0 002 2h6a2 2 0 002-2V8a2 2 0 00-2-2h-1V4a2 2 0 00-2-2zm-1 4V4a1 1 0 112 0v2H9z" clip-rule="evenodd" /></svg>` 
                : `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" /></svg>`;
            pinButton.onclick = () => openRecurringModal(todo);
            const deleteButton = document.createElement('button');
            deleteButton.className = 'text-gray-500 hover:text-red-500 transition-colors';
            deleteButton.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" /></svg>`;
            deleteButton.onclick = async () => await deleteDoc(doc(db, "todos", todo.id));
            controlsWrapper.appendChild(pinButton);
            controlsWrapper.appendChild(deleteButton);
            card.appendChild(checkbox);
            card.appendChild(textWrapper);
            card.appendChild(controlsWrapper);
            return card;
        }

        // --- 데이터 조작 함수 ---
        async function createNewUser(name) {
            const usersCollectionRef = collection(db, "users");
            const snapshot = await getDocs(usersCollectionRef);
            const newOrder = snapshot.size;

            const newUserRef = doc(usersCollectionRef);
            await setDoc(newUserRef, { id: newUserRef.id, name, order: newOrder, isActive: true });
        }
        async function deactivateUser(user) { await updateDoc(doc(db, "users", user.id), { isActive: false }); }
        async function restoreUser(userId) { await updateDoc(doc(db, "users", userId), { isActive: true }); }
        async function permanentlyDeleteUser(user) {
            await deleteDoc(doc(db, "users", user.id));
            const todosQuery = query(collection(db, "todos"), where("user", "==", user.name));
            const todoSnapshot = await getDocs(todosQuery);
            const batch = writeBatch(db);
            todoSnapshot.forEach(todoDoc => batch.delete(todoDoc.ref));
            await batch.commit();
        }
        
        async function resetUserTasks(user, date) {
            const q = query(collection(db, "todos"), where("user", "==", user), where("date", "==", date));
            const querySnapshot = await getDocs(q);
            const batch = writeBatch(db);
            querySnapshot.forEach((doc) => {
                const todo = doc.data();
                if (!todo.recurringDays || todo.recurringDays.length === 0) {
                    batch.delete(doc.ref);
                }
            });
            await batch.commit();
        }
        
        function editUserName(user, element) {
            const oldName = user.name;
            const input = document.createElement('input');
            input.type = 'text';
            input.value = oldName;
            input.className = 'text-xl font-bold text-gray-700 bg-white border-2 border-indigo-400 rounded-md text-center w-full';
            element.replaceWith(input);
            input.focus();
            const saveName = async () => {
                const newName = input.value.trim();
                if (newName && newName !== oldName) {
                    await updateDoc(doc(db, "users", user.id), { name: newName });
                    const todosQuery = query(collection(db, "todos"), where("user", "==", oldName));
                    const todoSnapshot = await getDocs(todosQuery);
                    const batch = writeBatch(db);
                    todoSnapshot.forEach(todoDoc => batch.update(todoDoc.ref, { user: newName }));
                    await batch.commit();
                }
                 input.replaceWith(element);
            };
            input.addEventListener('blur', saveName);
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') input.blur();
                else if (e.key === 'Escape') input.replaceWith(element);
            });
        }

        // --- 모달 관리 ---
        function openModal(user, period, date) {
            modalContext = { user, period, date };
            modalTitle.textContent = `${user} - ${period === 'am' ? '오전' : '오후'} 할 일 추가`;
            modal.classList.remove('hidden');
            setTimeout(() => modal.querySelector('.transform').classList.remove('scale-95'), 10);
        }
        function closeModal() {
            modal.querySelector('.transform').classList.add('scale-95');
            setTimeout(() => { modal.classList.add('hidden'); modalInput.value = ''; modalContext = {}; }, 300);
        }
        function showConfirmation(title, message, onConfirm) {
            confirmTitle.textContent = title;
            confirmMessage.innerHTML = message;
            confirmCallback = onConfirm;
            confirmModal.classList.remove('hidden');
            setTimeout(() => confirmModal.querySelector('.transform').classList.remove('scale-95'), 10);
        }
        function closeConfirmModal() {
            confirmModal.querySelector('.transform').classList.add('scale-95');
            setTimeout(() => { confirmModal.classList.add('hidden'); confirmCallback = () => {}; }, 300);
        }
        function openManageUserModal() {
            inactiveUserList.innerHTML = '';
            if (inactiveUsers.length > 0) {
                inactiveUsers.forEach(user => {
                    const userEl = document.createElement('div');
                    userEl.className = 'flex items-center justify-between p-2 rounded-md hover:bg-gray-100';
                    userEl.innerHTML = `
                        <span class="text-gray-800">${user.name}</span>
                        <div class="flex gap-2">
                            <button data-id="${user.id}" class="restore-btn px-3 py-1 text-sm bg-green-500 text-white rounded hover:bg-green-600">복원</button>
                            <button data-user-name="${user.name}" data-user-id="${user.id}" class="delete-permanently-btn px-3 py-1 text-sm bg-red-500 text-white rounded hover:bg-red-600">영구 삭제</button>
                        </div>
                    `;
                    inactiveUserList.appendChild(userEl);
                });
            } else {
                inactiveUserList.innerHTML = `<p class="text-center text-gray-500">비활성화된 사용자가 없습니다.</p>`;
            }
            manageUserModal.classList.remove('hidden');
            setTimeout(() => manageUserModal.querySelector('.transform').classList.remove('scale-95'), 10);
        }
        function closeManageUserModal() {
            manageUserModal.querySelector('.transform').classList.add('scale-95');
            setTimeout(() => manageUserModal.classList.add('hidden'), 300);
        }
        function openRecurringModal(todo) {
            recurringTodoContext = todo;
            dayCheckboxesContainer.innerHTML = '';
            daysOfWeek.forEach(day => {
                const isChecked = todo.recurringDays?.includes(day.value);
                const label = document.createElement('label');
                label.className = `p-2 rounded-md border-2 cursor-pointer ${isChecked ? 'bg-indigo-500 border-indigo-500 text-white' : 'bg-white border-gray-300'}`;
                label.innerHTML = `<input type="checkbox" value="${day.value}" class="sr-only" ${isChecked ? 'checked' : ''}><span>${day.label}</span>`;
                dayCheckboxesContainer.appendChild(label);
            });
            recurringStartInput.value = todo.startDate || todo.date;
            recurringEndInput.value = todo.endDate || '';
            recurringModal.classList.remove('hidden');
            setTimeout(() => recurringModal.querySelector('.transform').classList.remove('scale-95'), 10);
        }
        function closeRecurringModal() {
            recurringModal.querySelector('.transform').classList.add('scale-95');
            setTimeout(() => { recurringModal.classList.add('hidden'); recurringTodoContext = null; }, 300);
        }

        // --- 이벤트 리스너 ---
        function changeDate(days) {
            const currentDate = new Date(datePicker.value + 'T00:00:00');
            currentDate.setDate(currentDate.getDate() + days);
            datePicker.value = getFormattedDate(currentDate);
            render();
        }
        datePicker.addEventListener('change', render);
        prevDayBtn.addEventListener('click', () => changeDate(-1));
        nextDayBtn.addEventListener('click', () => changeDate(1));
        todayBtn.addEventListener('click', () => {
            datePicker.value = getFormattedDate(new Date());
            render();
        });
        modalForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = modalInput.value.trim();
            if (text === '') return;
            const { user, period, date } = modalContext;
            const newTodoRef = doc(collection(db, "todos"));
            await setDoc(newTodoRef, { id: newTodoRef.id, text, date, user, period, completed: false, recurringDays: [], startDate: date, endDate: null, skipDates: [], completions: {} });
            closeModal();
        });
        modalCloseBtn.addEventListener('click', closeModal);
        modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
        confirmYesBtn.addEventListener('click', () => { confirmCallback(); closeConfirmModal(); });
        confirmNoBtn.addEventListener('click', closeConfirmModal);
        confirmModal.addEventListener('click', (e) => { if (e.target === confirmModal) closeConfirmModal(); });
        addUserForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const newName = newUserNameInput.value.trim();
            if (newName) {
                await createNewUser(newName);
                newUserNameInput.value = '';
                closeManageUserModal();
            }
        });
        inactiveUserList.addEventListener('click', async (e) => {
            if (e.target.classList.contains('restore-btn')) {
                await restoreUser(e.target.dataset.id);
                closeManageUserModal();
            }
            if (e.target.classList.contains('delete-permanently-btn')) {
                const user = { id: e.target.dataset.userId, name: e.target.dataset.userName };
                closeManageUserModal();
                showConfirmation('사용자 영구 삭제', `<strong class="text-red-600">'${user.name}' 사용자와 관련된 모든 할 일 데이터가 영구적으로 삭제됩니다. 이 작업은 되돌릴 수 없습니다.</strong><br><br>정말로 삭제하시겠습니까?`, () => permanentlyDeleteUser(user));
            }
        });
        manageUserCloseBtn.addEventListener('click', closeManageUserModal);
        manageUserBtn.addEventListener('click', openManageUserModal);
        manageUserModal.addEventListener('click', (e) => { if (e.target === manageUserModal) closeManageUserModal(); });
        
        dayCheckboxesContainer.addEventListener('change', (e) => {
            const checkbox = e.target;
            if (checkbox.type === 'checkbox') {
                const label = checkbox.closest('label');
                if (label) {
                    if (checkbox.checked) {
                        label.classList.add('bg-indigo-500', 'border-indigo-500', 'text-white');
                        label.classList.remove('bg-white', 'border-gray-300');
                    } else {
                        label.classList.remove('bg-indigo-500', 'border-indigo-500', 'text-white');
                        label.classList.add('bg-white', 'border-gray-300');
                    }
                }
            }
        });

        saveRecurringBtn.addEventListener('click', async () => {
            const selectedDays = Array.from(dayCheckboxesContainer.querySelectorAll('input:checked')).map(input => parseInt(input.value));
            const startDate = recurringStartInput.value || recurringTodoContext.date;
            const endDate = recurringEndInput.value || null;
            await updateDoc(doc(db, "todos", recurringTodoContext.id), { recurringDays: selectedDays, startDate, endDate: endDate || null });
            closeRecurringModal();
        });
        unpinBtn.addEventListener('click', openUnpinModal);

        function openUnpinModal() {
            unpinModal.classList.remove('hidden');
            setTimeout(() => unpinModal.querySelector('.transform').classList.remove('scale-95'), 10);
        }
        function closeUnpinModal() {
            unpinModal.querySelector('.transform').classList.add('scale-95');
            setTimeout(() => unpinModal.classList.add('hidden'), 300);
        }
        unpinCurrentBtn.addEventListener('click', async () => {
            const currentDate = datePicker.value;
            await updateDoc(doc(db, "todos", recurringTodoContext.id), { skipDates: arrayUnion(currentDate) });
            closeUnpinModal();
            closeRecurringModal();
        });
        unpinFutureBtn.addEventListener('click', async () => {
            const currentDate = datePicker.value;
            await updateDoc(doc(db, "todos", recurringTodoContext.id), { endDate: currentDate });
            closeUnpinModal();
            closeRecurringModal();
        });
        unpinCancelBtn.addEventListener('click', closeUnpinModal);
        unpinModal.addEventListener('click', (e) => { if (e.target === unpinModal) closeUnpinModal(); });

        profileButton.addEventListener('click', (e) => {
            e.stopPropagation();
            profileDropdown.classList.toggle('hidden');
        });
        document.addEventListener('click', () => {
            profileDropdown.classList.add('hidden');
        });
        logoutBtn.addEventListener('click', (e) => {
            e.preventDefault();
            signOut(auth);
        });

        // --- 초기화 및 실시간 리스너 ---
        function initializeSortable() {
            if (sortableInstance) {
                sortableInstance.destroy();
            }
            sortableInstance = new Sortable(userLanesContainer, {
                animation: 150,
                handle: '.drag-handle',
                forceFallback: true, // 터치 호환성 옵션
                onEnd: async (evt) => {
                    const newOrderIds = Array.from(userLanesContainer.children).map(el => el.dataset.userId);
                    const batch = writeBatch(db);
                    newOrderIds.forEach((userId, index) => {
                        if (userId) {
                            const userRef = doc(db, "users", userId);
                            batch.update(userRef, { order: index });
                        }
                    });
                    await batch.commit();
                }
            });
        }

        async function initialize() {
            const today = new Date();
            datePicker.value = getFormattedDate(today);

            profileImage.src = currentUser.photoURL || 'https://placehold.co/40x40/EFEFEF/333333?text=U';
            profileName.textContent = currentUser.displayName;
            profileEmail.textContent = currentUser.email;
            
            onSnapshot(query(collection(db, "users"), orderBy("order")), async (snapshot) => {
                if (snapshot.empty) {
                    const defaultUsers = ['Alex', 'Bella', 'Chris', 'Dana', 'Evan', 'Fiona', 'George', 'Hannah'];
                    const batch = writeBatch(db);
                    defaultUsers.forEach((name, index) => {
                        const userRef = doc(collection(db, "users"));
                        batch.set(userRef, { id: userRef.id, name: name, order: index, isActive: true });
                    });
                    await batch.commit();
                } else {
                    const allUsers = snapshot.docs.map(doc => doc.data());
                    activeUsers = allUsers.filter(u => u.isActive);
                    inactiveUsers = allUsers.filter(u => !u.isActive);
                    render();
                }
            });
            onSnapshot(query(collection(db, "todos")), (snapshot) => {
                allTodos = snapshot.docs.map(doc => doc.data());
                render();
            });
        }

        initialize();
    });
    </script>
