<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPPA 플래너 로그인</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-50">

    <div class="min-h-screen flex flex-col items-center justify-center bg-gradient-to-br from-indigo-100 via-white to-sky-100 p-4">
        
        <div class="w-full max-w-sm">
            <!-- 로고 및 타이틀 -->
            <div class="text-center mb-8">
                <h1 class="text-4xl font-bold text-indigo-600">IPPA 플래너</h1>
                <p class="text-gray-500 mt-2">Google 계정으로 간편하게 시작하세요.</p>
            </div>

            <!-- 로그인 버튼 -->
            <div class="bg-white p-8 rounded-2xl shadow-lg">
                <div id="auth-container">
                    <button 
                        id="google-login-btn"
                        class="w-full flex justify-center items-center gap-3 py-3 px-4 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 transition-transform transform hover:scale-105"
                    >
                        <svg class="w-5 h-5" aria-hidden="true" focusable="false" data-prefix="fab" data-icon="google" role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 488 512">
                            <path fill="currentColor" d="M488 261.8C488 403.3 381.5 504 248 504 110.8 504 0 393.2 0 256S110.8 8 248 8c66.8 0 126 23.4 172.9 61.9l-69.5 69.5c-24.3-23.4-58.2-37.8-97.4-37.8-86.1 0-156.2 70.1-156.2 156.2s70.1 156.2 156.2 156.2c99.1 0 137.4-81.2 142.3-118.9H248v-85.3h236.1c2.3 12.7 3.9 24.9 3.9 41.4z"></path>
                        </svg>
                        <span>Google 계정으로 로그인</span>
                    </button>
                </div>
                <div id="loading-spinner" class="hidden text-center">
                    <p class="text-gray-600">로그인 중...</p>
                </div>
                 <div id="user-info" class="hidden text-center">
                    <p id="user-message" class="text-gray-800 font-medium"></p>
                    <button id="logout-btn" class="mt-4 text-sm text-indigo-600 hover:underline">로그아웃</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK 추가 -->
    <script type="module">
        // Firebase SDK 함수 임포트
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        // Firebase 구성 정보
        const firebaseConfig = {
            apiKey: "AIzaSyCaTxx4I3--oJM3GVAWyxxrUoQ7ii_LuHY",
            authDomain: "ippa-todo.firebaseapp.com",
            projectId: "ippa-todo",
            storageBucket: "ippa-todo.appspot.com",
            messagingSenderId: "160562508293",
            appId: "1:160562508293:web:5c7a03d0a7881b3323a26c",
            measurementId: "G-FVC3VK9TB7"
        };

        // Firebase 앱 및 Auth 초기화
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        // DOM 요소 가져오기
        const googleLoginBtn = document.getElementById('google-login-btn');
        const authContainer = document.getElementById('auth-container');
        const loadingSpinner = document.getElementById('loading-spinner');
        const userInfoDiv = document.getElementById('user-info');
        const userMessage = document.getElementById('user-message');
        const logoutBtn = document.getElementById('logout-btn');

        // UI 상태 업데이트 함수
        function updateUI(user) {
            if (user) {
                // 로그인 상태
                authContainer.classList.add('hidden');
                loadingSpinner.classList.add('hidden');
                userInfoDiv.classList.remove('hidden');
                userMessage.textContent = `${user.displayName}님, 환영합니다!`;
                 // 로그인 성공 시 2초 후 플래너 페이지로 이동 (실제 페이지 경로로 수정 필요)
                setTimeout(() => {
                    // window.location.href = './planner.html'; 
                    alert('플래너 페이지로 이동합니다.');
                }, 2000);
            } else {
                // 로그아웃 상태
                authContainer.classList.remove('hidden');
                loadingSpinner.classList.add('hidden');
                userInfoDiv.classList.add('hidden');
            }
        }

        // Google 로그인 버튼 클릭 이벤트
        googleLoginBtn.addEventListener('click', () => {
            loadingSpinner.classList.remove('hidden');
            authContainer.classList.add('hidden');

            signInWithPopup(auth, provider)
                .then((result) => {
                    // 로그인 성공
                    const user = result.user;
                    console.log("로그인 성공:", user);
                    // UI 업데이트는 onAuthStateChanged에서 처리
                })
                .catch((error) => {
                    // 로그인 실패
                    console.error("로그인 오류:", error);
                    alert(`로그인에 실패했습니다: ${error.message}`);
                    updateUI(null); // UI를 다시 로그인 버튼 상태로 복원
                });
        });

        // 로그아웃 버튼 클릭 이벤트
        logoutBtn.addEventListener('click', () => {
            signOut(auth).then(() => {
                console.log('로그아웃 성공');
            }).catch((error) => {
                console.error('로그아웃 오류:', error);
            });
        });

        // 인증 상태 변경 감지
        onAuthStateChanged(auth, (user) => {
            updateUI(user);
        });

    </script>

</body>
</html>
